<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode & QR Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 md:p-10">
        
        <!-- Language Switcher & Header -->
        <div class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
            <div>
                <h1 data-i18n="title" class="text-2xl md:text-3xl font-bold text-teal-400">مولد الباركود و QR Code</h1>
                <p data-i18n="subtitle" class="text-slate-400 text-sm mt-1">أنشئ وخصص الأكواد بسرعة وسهولة</p>
            </div>
            <select id="langSelect" onchange="setLanguage(this.value)" class="bg-slate-700 text-slate-100 px-3 py-2 rounded-lg border border-slate-600 focus:outline-none">
                <option value="ar">العربية</option>
                <option value="en">English</option>
            </select>
        </div>

        <!-- Main Form Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Controls -->
            <div class="space-y-4">
                <div>
                    <label data-i18n="type_label" class="block text-sm font-medium mb-1">نوع الكود</label>
                    <select id="mode" class="w-full bg-slate-700 p-3 rounded-lg border border-slate-600" onchange="toggleBarcodeOptions()">
                        <option value="qr">QR Code</option>
                        <option value="barcode">Barcode</option>
                    </select>
                </div>

                <div id="barcodeTypeGroup" class="hidden">
                    <label data-i18n="barcode_type" class="block text-sm font-medium mb-1">صيغة الباركود</label>
                    <select id="bcid" class="w-full bg-slate-700 p-3 rounded-lg border border-slate-600">
                        <option value="code128">Code 128</option>
                        <option value="ean13">EAN-13</option>
                        <option value="upca">UPC-A</option>
                        <option value="code39">Code 39</option>
                    </select>
                </div>

                <div>
                    <label data-i18n="text_label" class="block text-sm font-medium mb-1">النص / الرابط</label>
                    <input type="text" id="inputText" data-i18n="text_placeholder" placeholder="أدخل النص..." class="w-full bg-slate-700 p-3 rounded-lg border border-slate-600 focus:border-teal-400 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label data-i18n="size_label" class="block text-sm font-medium mb-1">الحجم</label>
                        <input type="number" id="size" value="300" class="w-full bg-slate-700 p-3 rounded-lg border border-slate-600">
                    </div>
                    <div>
                        <label data-i18n="color_label" class="block text-sm font-medium mb-1">اللون</label>
                        <input type="color" id="color" value="#000000" class="w-full h-12 bg-slate-700 p-1 rounded-lg border border-slate-600 cursor-pointer">
                    </div>
                </div>

                <div>
                    <label data-i18n="format_label" class="block text-sm font-medium mb-1">صيغة التحميل</label>
                    <select id="fileFormat" class="w-full bg-slate-700 p-3 rounded-lg border border-slate-600">
                        <option value="png">PNG</option>
                        <option value="svg">SVG</option>
                    </select>
                </div>

                <button onclick="generateCode()" data-i18n="generate_btn" class="w-full bg-teal-500 hover:bg-teal-600 text-slate-900 font-bold py-3 rounded-lg transition-colors">
                    توليد الكود
                </button>
            </div>

            <!-- Preview Area -->
            <div class="flex flex-col items-center justify-center border-2 border-dashed border-slate-700 rounded-xl p-6 bg-slate-800/50">
                <div id="previewBox" class="bg-white p-4 rounded-lg shadow-md mb-6 flex items-center justify-center min-h-[220px] min-w-[220px]">
                    <span class="text-slate-400 text-sm">Preview Area</span>
                </div>

                <button id="downloadBtn" onclick="downloadCode()" data-i18n="download_btn" class="hidden bg-slate-700 hover:bg-slate-600 text-teal-400 border border-teal-500/30 font-bold px-6 py-2.5 rounded-lg transition-colors">
                    تحميل الكود
                </button>
            </div>

        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
